name: CI test

on:
  # Triggers the workflow on push or pull request events
  - pull_request
  - push
  # Allows you to run this workflow manually from the Actions tab
  - workflow_dispatch

# This workflow intentionally runs WITHOUT any cloud credentials. The suites that
# hit real external services (GCS / Vision / Gemini / BigQuery) are env-guarded
# and therefore skipped here — they run in integration.yml instead. Keeping them
# out of the per-push/PR gate avoids per-run API cost and external-service
# flakiness (e.g. STS token "Premature close").
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    services:
      rumors-test-db:
        image: elasticsearch:9.3.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
        ports:
          - 62223:9200

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - name: Update coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
